# AWS Amplify Hosting build spec (CD). Amplify builds and deploys every push to a connected branch.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22 || (nvm install 22 && nvm use 22)
        - npm ci
    build:
      commands:
        # Make Amplify environment variables available to the server at runtime.
        - env | grep -E '^(STRIPE_|NEXT_PUBLIC_)' >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
